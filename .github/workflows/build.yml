name: Build Unsigned TranslitPro IPA

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Ensure KeyboardViewController is principal class
        run: |
          /usr/libexec/PlistBuddy -c "Set :NSExtension:NSExtensionPrincipalClass \$(PRODUCT_MODULE_NAME).KeyboardViewController" Keyboard/Info.plist || true

      - name: Upgrade legacy Swift 3/4 syntax to Swift 5
        run: |
          python3 - << 'EOF'
          import glob, re

          replacements = [
              (r'\.characters\b', ''),
              (r'\bUIControlEvents\b', 'UIControl.Event'),
              (r'\bUIControlState\b', 'UIControl.State'),
              (r'\bUIControlContentHorizontalAlignment\b', 'UIControl.ContentHorizontalAlignment'),
              (r'\bUIControlContentVerticalAlignment\b', 'UIControl.ContentVerticalAlignment'),
              (r'\bUITableViewCellStyle\b', 'UITableViewCell.CellStyle'),
              (r'\bUITableViewCellAccessoryType\b', 'UITableViewCell.AccessoryType'),
              (r'\bUITableViewCellSelectionStyle\b', 'UITableViewCell.SelectionStyle'),
              (r'\bUITableViewAutomaticDimension\b', 'UITableView.automaticDimension'),
              (r'\bNSLayoutAttribute\b', 'NSLayoutConstraint.Attribute'),
              (r'\bNSLayoutRelation\b', 'NSLayoutConstraint.Relation'),
              (r'\bNSLayoutFormatOptions\b', 'NSLayoutConstraint.FormatOptions'),
              (r'\bNSAttributedStringKey\b', 'NSAttributedString.Key'),
              (r'\bUIViewAutoresizing\b', 'UIView.AutoresizingMask'),
              (r'\bUIViewContentMode\b', 'UIView.ContentMode'),
              (r'\bRunLoopMode\.defaultRunLoopMode\b', 'RunLoop.Mode.default'),
              (r'\bRunLoopMode\.commonModes\b', 'RunLoop.Mode.common'),
              (r'\bRunLoopMode\b', 'RunLoop.Mode'),
              (r'\bdefaultRunLoopMode\b', 'default'),
              (r'\bNotification\.Name\.UIKeyboard', 'UIResponder.keyboard'),
              (r'\bNSNotification\.Name\.UIKeyboard', 'UIResponder.keyboard'),
              (r'\bUIApplicationOpenSettingsURLString\b', 'UIApplication.openSettingsURLString'),
              (r'\bUIApplicationState\b', 'UIApplication.State'),
              (r'\bUIGestureRecognizerState\b', 'UIGestureRecognizer.State'),
              (r'\bUITouchPhase\b', 'UITouch.Phase'),
              (r'\bUIEventSubtype\b', 'UIEvent.EventSubtype'),
              (r'\bkCALineCap', 'CAShapeLayerLineCap.'),
              (r'\bkCALineJoin', 'CAShapeLayerLineJoin.'),
              (r'UIAccessibilityIsReduceTransparencyEnabled\(\)', 'UIAccessibility.isReduceTransparencyEnabled'),
              (r'UILayoutPriority\((\d+)\)', r'UILayoutPriority(rawValue: \1)'),
              (r'UILayoutPriorityRequired', 'UILayoutPriority.required'),
              (r'M_PI_2', 'Double.pi / 2'),
              (r'M_PI', 'Double.pi'),
              (r'\bCGFloat\(Double\.pi\)', 'CGFloat.pi'),
              (r'\bCGRectMake\(([^,]+),\s*([^,]+),\s*([^,]+),\s*([^)]+)\)', r'CGRect(x: \1, y: \2, width: \3, height: \4)'),
              (r'\bCGPointMake\(([^,]+),\s*([^)]+)\)', r'CGPoint(x: \1, y: \2)'),
              (r'\bCGSizeMake\(([^,]+),\s*([^)]+)\)', r'CGSize(width: \1, height: \2)'),
              (r'\bUIEdgeInsetsMake\(([^,]+),\s*([^,]+),\s*([^,]+),\s*([^)]+)\)', r'UIEdgeInsets(top: \1, left: \2, bottom: \3, right: \4)'),
              (r'^(\s*)(override\s+|public\s+|internal\s+|private\s+|fileprivate\s+)?func\s+(defaultsChanged|showPopup|hidePopup|hidePopupDelay|highlightKey|unHighlightKey|hidePopupCallback|respondTo|toggle|advance|backspace|shift|mode|handle|keyboard|didReceive|viewDid|viewWill|tableView|numberOfSections|scrollView|banner|settings|close|done|pollTraits|playKeySound|cancel|delete|return|space|globe|longPress|tap)', r'\1@objc \2func \3'),
              (r'@objc\s+((?:override\s+|public\s+|internal\s+|private\s+|fileprivate\s+)?func\s+(?:updateKeyCaps|keyPressed\s*\(\s*_\s*key\s*:\s*Key))', r'\1'),
          ]

          for path in glob.glob('**/*.swift', recursive=True):
              with open(path, 'r', encoding='utf-8') as f:
                  content = f.read()
              new_content = content
              for pattern, repl in replacements:
                  flags = re.MULTILINE if pattern.startswith('^') else 0
                  new_content = re.sub(pattern, repl, new_content, flags=flags)
              if new_content != content:
                  with open(path, 'w', encoding='utf-8') as f:
                      f.write(new_content)
          EOF

      - name: Generate Xcode Project
        run: |
          rm -rf TastyImitationKeyboard.xcodeproj
          xcodegen generate

      - name: Build Unsigned App & Extension
        run: |
          xcodebuild clean build \
            -project TranslitPro.xcodeproj \
            -scheme HostingApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -r build/DerivedData/Build/Products/Release-iphoneos/HostingApp.app build/Payload/
          cd build
          zip -r -y TranslitPro.ipa Payload

      - name: Upload TranslitPro.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TranslitPro-Unsigned-IPA
          path: build/TranslitPro.ipa
