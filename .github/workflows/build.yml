name: Build Unsigned TranslitPro IPA

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Ensure KeyboardViewController is principal class
        run: |
          /usr/libexec/PlistBuddy -c "Set :NSExtension:NSExtensionPrincipalClass \$(PRODUCT_MODULE_NAME).KeyboardViewController" Keyboard/Info.plist || true

      - name: Generate Xcode Project
        run: |
          rm -rf TastyImitationKeyboard.xcodeproj
          xcodegen generate

      - name: Build Unsigned App & Extension
        run: |
          xcodebuild build \
            -project TranslitPro.xcodeproj \
            -scheme HostingApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -r build/DerivedData/Build/Products/Release-iphoneos/HostingApp.app build/Payload/
          cd build
          zip -r -y TranslitPro.ipa Payload

      - name: Upload TranslitPro.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TranslitPro-Unsigned-IPA
          path: build/TranslitPro.ipa
